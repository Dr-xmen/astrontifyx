        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>

    <div class="sidebar-bottom">
      <button onclick="window.signOut && window.signOut()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 14px;border-radius:10px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.08);color:#ef4444;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s" onmouseover="this.style.background='rgba(239,68,68,.18)';this.style.borderColor='rgba(239,68,68,.5)'" onmouseout="this.style.background='rgba(239,68,68,.08)';this.style.borderColor='rgba(239,68,68,.3)'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Log Out</span>
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="tb-left">
        <div class="tb-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </div>
        <span class="page-title">Withdraw</span>
      </div>
      <div class="tb-right">
        <div class="tb-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        <div class="tb-btn notif-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot"></span>
        </div>
        <div class="tb-btn" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </div>

      </div>
    </div>

    <div class="content fade-in">

      <div class="grid g12" style="margin-bottom:14px">
        <!-- Crypto Withdrawal -->
        <div class="card">
          <div class="section-hdr"><span class="section-title">Crypto Withdrawal</span></div>
          <div class="fg">
            <label>Currency</label>
            <select id="cryptoCurrency">
              <option>BTC - Bitcoin</option><option>ETH - Ethereum</option><option>USDT - Tether</option>
              <option>BNB - BNB</option><option>SOL - Solana</option>
            </select>
          </div>
          <div class="fg">
            <label>Wallet Address</label>
            <input id="cryptoWithdrawWallet" placeholder="Enter destination wallet address">
          </div>
          <div class="grid g2">
            <div class="fg">
              <label>Amount</label>
              <input type="number" id="cryptoWithdrawAmount" placeholder="0.00">
            </div>
            <div class="fg">
              <label>Network</label>
              <select><option>Mainnet</option><option>ERC20</option><option>TRC20</option><option>BEP20</option></select>
            </div>
          </div>
          <button class="btn btn-primary" onclick="window.submitWithdrawal && window.submitWithdrawal()" style="width:100%;justify-content:center">Submit Withdrawal</button>
        </div>

        <!-- Bank Withdrawal -->
        <div class="card">
          <div class="section-hdr"><span class="section-title">Bank Withdrawal</span></div>
          <div class="fg"><label>Bank Name</label><input id="bankName" placeholder="Enter bank name"></div>
          <div class="grid g2">
            <div class="fg"><label>Account Number</label><input id="accountNumber" placeholder="Account number"></div>
            <div class="fg"><label>Account Name</label><input id="accountName" placeholder="Account name"></div>
          </div>
          <div class="fg"><label>Amount</label><input id="bankWithdrawAmount" type="number" placeholder="0.00"></div>
          <button class="btn btn-outline" onclick="window.submitBankWithdrawal && window.submitBankWithdrawal()" style="width:100%;justify-content:center">Request Bank Withdrawal</button>
        </div>
      </div>

      <!-- Withdrawal History -->
      <div class="card">
        <div class="section-hdr"><span class="section-title">Withdrawal History</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>Method</th><th>Amount</th><th>Date</th><th>Status</th><th></th></tr></thead>
          <tbody id="withdrawHistoryBody"><tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">No withdrawals yet</td></tr></tbody>
        </table></div>
      </div>

    </div>

</div>

<script src="shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script type="module">
const supabase = window.ATRONTIFY_DB;
window.userData = { balance: 0 };

async function signOut() { await supabase.auth.signOut(); location.href = 'login.html'; }
window.signOut = signOut;

async function loadWithdrawals(userId) {
  const { data } = await supabase.from('withdrawal_requests').select('*').eq('user_id', userId).order('created_at',{ascending:false});
  const tbody = document.getElementById('withdrawHistoryBody');
  if (!data || !data.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">No withdrawals yet</td></tr>'; return; }
  const statusCls = s => s==='approved'?'bg':s==='pending'?'ba':'br';
  tbody.innerHTML = data.map(w => `<tr>
    <td style="font-size:11px;color:var(--text3)">${w.id?.slice(0,8)||'—'}…</td>
    <td>${w.destination_type||'—'}</td>
    <td class="mono">$${Number(w.amount||0).toFixed(2)}</td>
    <td style="font-size:11.5px;color:var(--text3)">${w.created_at?new Date(w.created_at).toLocaleDateString():'—'}</td>
    <td><span class="badge ${statusCls(w.status)}">${w.status||'—'}</span></td>
    <td>${w.status==='pending'?`<button class="btn btn-red btn-sm" onclick="cancelWithdrawal('${w.id}',${w.amount})">Cancel</button>`:'—'}</td>
  </tr>`).join('');
}

async function cancelWithdrawal(id, amount) {
  if (!confirm('Cancel this withdrawal? The amount will be returned to your balance.')) return;
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return;
  await supabase.from('withdrawal_requests').update({ status: 'cancelled' }).eq('id', id);
  // Refund the held amount back to balance
  const { data: prof } = await supabase.from('profiles').select('balance').eq('id', user.id).single();
  const refunded = parseFloat(prof?.balance || 0) + parseFloat(amount);
  await supabase.from('profiles').update({ balance: refunded, equity: refunded }).eq('id', user.id);
  window.userData.balance = refunded;
  alert('Withdrawal cancelled. $' + Number(amount).toFixed(2) + ' has been returned to your balance.');
  await loadWithdrawals(user.id);
}
window.cancelWithdrawal = cancelWithdrawal;

window.submitWithdrawal = async function() {
  const wallet = (document.getElementById('cryptoWithdrawWallet')?.value || '').trim();
  const amount = parseFloat(document.getElementById('cryptoWithdrawAmount')?.value || 0);
  if (!wallet) { alert('Enter wallet address'); return; }
  if (!amount || amount <= 0) { alert('Enter valid withdrawal amount'); return; }
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { alert('Login required'); return; }
  if (amount > Number(window.userData?.balance || 0)) { alert('Insufficient balance'); return; }
  const { error } = await supabase.from('withdrawal_requests').insert({
    user_id: user.id, amount, destination_type: 'crypto', destination_name: 'BTC', destination_ref: wallet, status: 'pending'
  });
  if (error) { alert(error.message); return; }
  const newBalance = Number(window.userData.balance || 0) - amount;
  await supabase.from('profiles').update({balance: newBalance}).eq('id', user.id);
  window.userData.balance = newBalance;
  alert('Crypto withdrawal submitted successfully');
  await loadWithdrawals(user.id);
};

window.submitBankWithdrawal = async function() {
  const bankName = document.getElementById('bankName')?.value || '';
  const accountName = document.getElementById('accountName')?.value || '';
  const accountNumber = document.getElementById('accountNumber')?.value || '';
  const amount = parseFloat(document.getElementById('bankWithdrawAmount')?.value || 0);
  if (!bankName || !accountName || !accountNumber) { alert('Complete all bank withdrawal fields'); return; }
  if (!amount || amount <= 0) { alert('Enter valid withdrawal amount'); return; }
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { alert('Authentication required'); return; }
  if (amount > Number(window.userData?.balance || 0)) { alert('Insufficient balance'); return; }
  const { error } = await supabase.from('withdrawal_requests').insert({
    user_id: user.id, amount, destination_type: 'bank', destination_name: bankName,
    destination_ref: accountName + ' | ' + accountNumber, status: 'pending'
  });
  if (error) { alert(error.message); return; }
  const newBalance = Number(window.userData.balance || 0) - amount;
  await supabase.from('profiles').update({balance: newBalance}).eq('id', user.id);
  window.userData.balance = newBalance;
  alert('Bank withdrawal request submitted successfully');
  await loadWithdrawals(user.id);
};

window.addEventListener('load', async () => {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { location.href = 'login.html'; return; }
  const { data: profile } = await supabase.from('profiles').select('first_name,last_name,balance,avatar_url').eq('id', user.id).single();
  const firstName = profile?.first_name || '';
  const lastName  = profile?.last_name  || '';
  const initials  = (firstName && lastName) ? `${firstName[0]}${lastName[0]}`.toUpperCase() : (user.email||'U')[0].toUpperCase();
  setAvatar(document.getElementById('userAvatar'), profile?.avatar_url, initials);
  window.userData.balance = profile?.balance || 0;
  await loadWithdrawals(user.id);
});
</script>
</body>
</html>
