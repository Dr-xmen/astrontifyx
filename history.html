<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtrontifyX — History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="logo">
      <img src="assets/logo.png" alt="AtrontifyX" style="width:180px;height:100px;object-fit:contain;border-radius:12px;flex-shrink:0">
    </div>
    <nav class="nav">
      <div class="nav-section">Main</div>
      <div class="nav-item" data-page="dashboard" onclick="location.href='dashboard.html'">
        <svg viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        <span class="nav-label">Dashboard</span>
      </div>
      <div class="nav-item" data-page="markets" onclick="location.href='markets.html'">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span class="nav-label">Markets</span>
      </div>
      <div class="nav-item" data-page="terminal" onclick="location.href='trade-terminal.html'">
        <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span class="nav-label">Trade Terminal</span>
      </div>
      <div class="nav-section">Finance</div>
      <div class="nav-item" data-page="deposit" onclick="location.href='deposit.html'">
        <svg viewBox="0 0 24 24"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
        <span class="nav-label">Deposit</span>
      </div>
      <div class="nav-item" data-page="withdraw" onclick="location.href='withdrawal.html'">
        <svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="m6 13 6-6 6 6"/><path d="M19 3H5"/></svg>
        <span class="nav-label">Withdraw</span>
      </div>
      <div class="nav-section">Account</div>
      <div class="nav-item" data-page="history" onclick="location.href='history.html'">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span class="nav-label">History</span>
      </div>
      <div class="nav-item" data-page="settings" onclick="location.href='settings.html'">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span class="nav-label">Settings</span>
      </div>
      <div class="nav-item" data-navaction="verification" onclick="location.href='settings.html#verification'">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="nav-label">Verification</span>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <div class="nav-item" style="color:var(--red)" onclick="window.signOut && window.signOut()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="nav-label">Sign Out</span>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="tb-left">
        <div class="tb-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </div>
        <span class="page-title">History</span>
      </div>
      <div class="tb-right">
        <div class="tb-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        <div class="tb-btn notif-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot"></span>
        </div>
        <div class="tb-btn" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </div>
        <div class="avatar" id="userAvatar">--</div>
      </div>
    </div>

    <div class="content fade-in">

      <!-- Tabs -->
      <div class="tabs" style="margin-bottom:14px">
        <div class="tab active" id="tabDeposits" onclick="setHistTab('deposits')">Deposits</div>
        <div class="tab" id="tabWithdrawals" onclick="setHistTab('withdrawals')">Withdrawals</div>
        <div class="tab" id="tabTrades" onclick="setHistTab('trades')">Trades</div>
      </div>

      <!-- Deposits Table -->
      <div id="panelDeposits" class="card">
        <div class="section-hdr"><span class="section-title">Deposit History</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>Asset</th><th>Amount</th><th>TxHash</th><th>Date</th><th>Status</th></tr></thead>
          <tbody id="depositBody"><tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">Loading…</td></tr></tbody>
        </table></div>
      </div>

      <!-- Withdrawals Table -->
      <div id="panelWithdrawals" class="card" style="display:none">
        <div class="section-hdr"><span class="section-title">Withdrawal History</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>Method</th><th>Amount</th><th>Date</th><th>Status</th><th></th></tr></thead>
          <tbody id="withdrawBody"><tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">Loading…</td></tr></tbody>
        </table></div>
      </div>

      <!-- Trades Table -->
      <div id="panelTrades" class="card" style="display:none">
        <div class="section-hdr"><span class="section-title">Trade History</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>Pair</th><th>Type</th><th>P&L</th><th>Date</th></tr></thead>
          <tbody id="tradeBody"><tr><td colspan="5" style="text-align:center;color:var(--text3);padding:20px">Loading…</td></tr></tbody>
        </table></div>
      </div>

    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
let histTab = 'deposits';

function setHistTab(t) {
  histTab = t;
  ['deposits','withdrawals','trades'].forEach(name => {
    document.getElementById('tab'+name[0].toUpperCase()+name.slice(1)).classList.toggle('active', name===t);
    document.getElementById('panel'+name[0].toUpperCase()+name.slice(1)).style.display = name===t ? '' : 'none';
  });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script type="module">
const supabase = window.ATRONTIFY_DB;

async function signOut() { await supabase.auth.signOut(); location.href = 'login.html'; }
window.signOut = signOut;

const statusCls = s => s==='approved'?'bg':s==='pending'?'ba':'br';

async function loadAll(userId) {
  // Deposits
  const { data: deps } = await supabase.from('deposit_requests').select('*').eq('user_id', userId).order('created_at',{ascending:false});
  document.getElementById('depositBody').innerHTML = deps && deps.length
    ? deps.map(d=>`<tr>
        <td style="font-size:11px;color:var(--text3)">${d.id?.slice(0,8)||'—'}…</td>
        <td>${d.coin||'—'}</td>
        <td class="mono">$${Number(d.amount||0).toFixed(2)}</td>
        <td class="mono" style="font-size:11px;color:var(--text3)">${d.tx_hash?d.tx_hash.slice(0,12)+'…':'—'}</td>
        <td style="font-size:11.5px;color:var(--text3)">${d.created_at?new Date(d.created_at).toLocaleDateString():'—'}</td>
        <td><span class="badge ${statusCls(d.status)}">${d.status||'—'}</span></td>
      </tr>`).join('')
    : '<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">No deposits yet</td></tr>';

  // Withdrawals
  const { data: wds } = await supabase.from('withdrawal_requests').select('*').eq('user_id', userId).order('created_at',{ascending:false});
  document.getElementById('withdrawBody').innerHTML = wds && wds.length
    ? wds.map(w=>`<tr>
        <td style="font-size:11px;color:var(--text3)">${w.id?.slice(0,8)||'—'}…</td>
        <td>${w.destination_type||'—'}</td>
        <td class="mono">$${Number(w.amount||0).toFixed(2)}</td>
        <td style="font-size:11.5px;color:var(--text3)">${w.created_at?new Date(w.created_at).toLocaleDateString():'—'}</td>
        <td><span class="badge ${statusCls(w.status)}">${w.status||'—'}</span></td>
        <td>${w.status==='pending'?`<button class="btn btn-red btn-sm" onclick="cancelWithdrawal('${w.id}',${w.amount})">Cancel</button>`:'—'}</td>
      </tr>`).join('')
    : '<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">No withdrawals yet</td></tr>';

  // Trades
  const { data: trades } = await supabase.from('trades').select('*').eq('user_id', userId).order('opened_at',{ascending:false});
  document.getElementById('tradeBody').innerHTML = trades && trades.length
    ? trades.map(t=>`<tr>
        <td style="font-size:11px;color:var(--text3)">${String(t.id||'').slice(0,8)||'—'}</td>
        <td>${t.symbol||'—'}</td>
        <td><span class="badge ${(t.side||'').toUpperCase()==='BUY'?'bg':'br'}">${(t.side||'—').toUpperCase()}</span></td>
        <td class="mono ${(t.pnl||0)>=0?'up':'dn'}">${(t.pnl||0)>=0?'+':''}$${Math.abs(t.pnl||0).toFixed(2)}</td>
        <td style="font-size:11.5px;color:var(--text3)">${t.opened_at?new Date(t.opened_at).toLocaleDateString():'—'}</td>
      </tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:20px">No trades yet</td></tr>';
}

window.cancelWithdrawal = async function(id, amount) {
  if (!confirm('Cancel this withdrawal? The amount will be returned to your balance.')) return;
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return;
  await supabase.from('withdrawal_requests').update({ status: 'cancelled' }).eq('id', id);
  const { data: prof } = await supabase.from('profiles').select('balance').eq('id', user.id).single();
  const refunded = parseFloat(prof?.balance || 0) + parseFloat(amount);
  await supabase.from('profiles').update({ balance: refunded, equity: refunded }).eq('id', user.id);
  alert('Withdrawal cancelled. $' + Number(amount).toFixed(2) + ' has been returned to your balance.');
  await loadAll(user.id);
};

window.addEventListener('load', async () => {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { location.href = 'login.html'; return; }
  const { data: profile } = await supabase.from('profiles').select('first_name,last_name').eq('id', user.id).single();
  const firstName = profile?.first_name || '';
  const lastName  = profile?.last_name  || '';
  const initials  = (firstName && lastName) ? `${firstName[0]}${lastName[0]}`.toUpperCase() : (user.email||'U')[0].toUpperCase();
  const avatar = document.getElementById('userAvatar');
  if (avatar) avatar.textContent = initials;
  await loadAll(user.id);
});
</script>
</body>
</html>
