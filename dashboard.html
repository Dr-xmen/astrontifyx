<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtrontifyX Trading Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#0d0e12;--bg2:#13151c;--bg3:#1a1d27;--bg4:#1f2235;
  --border:#ffffff0f;--border2:#ffffff18;--border3:#ffffff25;
  --text1:#f0f2ff;--text2:#9ea8c8;--text3:#5a6380;
  --accent:#4f6ef7;--accent2:#6b84f8;--accentg:linear-gradient(135deg,#4f6ef7,#7c3aed);
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--teal:#14b8a6;
  --card:rgba(255,255,255,0.03);--glass:rgba(255,255,255,0.05);
  --shadow:0 8px 32px rgba(0,0,0,0.4);
}
.light{
  --bg1:#f0f2f8;--bg2:#e8eaf5;--bg3:#ffffff;--bg4:#f5f6fc;
  --border:#00000010;--border2:#00000018;--border3:#00000025;
  --text1:#0d0e12;--text2:#4a5275;--text3:#8892b0;
  --card:rgba(255,255,255,0.8);--glass:rgba(255,255,255,0.9);
  --shadow:0 8px 32px rgba(0,0,0,0.08);
}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg1);color:var(--text1);min-height:100vh;transition:background .3s,color .3s}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border3);border-radius:2px}

/* LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s;overflow:hidden}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-section,.sidebar.collapsed .logo-text{opacity:0;pointer-events:none;width:0;overflow:hidden}
.logo{height:72px;padding:10px 12px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden}
.logo-icon{width:36px;height:36px;background:var(--accentg);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:18px;font-weight:700}
.logo-text{font-size:18px;font-weight:700;letter-spacing:2px;background:var(--accentg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.nav{padding:10px 8px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-section{font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--text3);padding:10px 10px 4px;text-transform:uppercase;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;white-space:nowrap;margin-bottom:2px;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s;user-select:none}
.nav-item:hover{background:var(--glass);color:var(--text1)}
.nav-item.active{background:linear-gradient(135deg,rgba(79,110,247,0.18),rgba(124,58,237,0.08));color:var(--accent2);border-color:rgba(79,110,247,0.25)}
.nav-item svg{flex-shrink:0;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sidebar-bottom{padding:10px 8px;border-top:1px solid var(--border);flex-shrink:0}

/* TOPBAR */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:58px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px;flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tb-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.page-title{font-size:15px;font-weight:600;white-space:nowrap}
.tb-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border2);background:var(--glass);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s;flex-shrink:0}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(79,110,247,0.1)}
.tb-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ticker-bar{display:flex;align-items:center;overflow:hidden;flex:1;background:var(--bg3);border-radius:8px;padding:0 12px;height:38px;font-family:'JetBrains Mono',monospace;font-size:11px;min-width:0;gap:0}
.tick{display:flex;gap:5px;margin-right:22px;white-space:nowrap;flex-shrink:0}
.tick-sym{color:var(--text3)}
.tick-p{color:var(--text1);font-weight:500}
.tick-c{font-weight:600}
.up{color:var(--green)}
.dn{color:var(--red)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accentg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;color:#fff}
.notif-wrap{position:relative}
.notif-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--red);border-radius:50%}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.g23{grid-template-columns:2fr 3fr}
.g12{grid-template-columns:1fr 1fr}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat-label{font-size:10.5px;color:var(--text3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.stat-val{font-size:21px;font-weight:700;font-family:'JetBrains Mono',monospace}
.stat-chg{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px}
.stat-chg svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.3px}
.bg{background:rgba(34,197,94,0.15);color:var(--green)}
.br{background:rgba(239,68,68,0.15);color:var(--red)}
.ba{background:rgba(245,158,11,0.15);color:var(--amber)}
.bb{background:rgba(79,110,247,0.15);color:var(--accent2)}
.bgr{background:var(--glass);color:var(--text2)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--text3);font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text2)}
td:first-child{color:var(--text1);font-weight:500}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--glass)}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all .2s;white-space:nowrap}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--accentg);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);background:rgba(79,110,247,0.08)}
.btn-green{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-green:hover{opacity:.9;transform:translateY(-1px)}
.btn-red{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn-red:hover{opacity:.9;transform:translateY(-1px)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}

/* FORMS */
input,select,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--text1);font-family:inherit;font-size:13.5px;padding:10px 14px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
label{font-size:11.5px;color:var(--text3);margin-bottom:6px;display:block;font-weight:500}
.fg{margin-bottom:14px}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:7px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text3);transition:all .2s;white-space:nowrap;user-select:none}
.tab.active{background:var(--bg4);color:var(--text1)}

/* MISC */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.section-title{font-size:14.5px;font-weight:600}
.divider{height:1px;background:var(--border);margin:16px 0}
.progress-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s}
.toggle{width:42px;height:23px;background:var(--bg4);border-radius:12px;cursor:pointer;position:relative;border:1px solid var(--border2);transition:background .3s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;background:#fff;border-radius:50%;transition:transform .3s}
.toggle.on::after{transform:translateX(19px)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;animation:pulse 2s infinite}
.chart-wrap{width:100%;position:relative}
.chart-wrap canvas{display:block}

/* MARKET ROW */
.mrow{display:flex;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;gap:10px;transition:background .15s}
.mrow:hover{background:var(--glass)}
.a-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}

/* CRYPTO CARD */
.cc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:all .2s}
.cc:hover{border-color:var(--accent);transform:translateY(-1px)}
.cc.sel{border-color:var(--accent);background:rgba(79,110,247,0.07)}

/* QR */
.qr-box{width:155px;height:155px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:14px auto;padding:8px}
.copy-row{display:flex;gap:8px;align-items:center}
.copy-row input{font-family:'JetBrains Mono',monospace;font-size:11px}

/* QTY */
.qty-ctrl{display:flex;align-items:center;border:1px solid var(--border2);border-radius:10px;overflow:hidden}
.qty-btn{width:38px;height:38px;background:var(--bg3);border:none;color:var(--text2);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.qty-btn:hover{color:var(--text1);background:var(--glass)}
.qty-input{flex:1;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);border-radius:0;text-align:center;height:38px}

/* SEARCH */
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.search-wrap input{padding-left:34px}

/* SETTINGS NAV */
.settings-layout{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:start}
.settings-nav .nav-item{font-size:13px;margin-bottom:2px}

/* TRADE PANEL */
.trade-panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px}

/* FILTER BAR */
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-in{animation:fadeIn .25s ease forwards}


.sidebar.collapsed .logo{
  justify-content:center;
  padding:14px 0;
}


.sidebar.collapsed .logo img{
  width:44px !important;
  max-height:44px !important;
  object-fit:contain;
}


.sidebar.collapsed .logo-text{
  display:none;
}


@media(max-width:860px){
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
  .settings-layout{grid-template-columns:1fr}
  .sidebar{width:62px}
  .ticker-bar{display:none}
}
@media(max-width:580px){
  .g2,.g12,.g23{grid-template-columns:1fr}
  .content{padding:12px}
}

.tradingview-widget-container,
.tradingview-widget-container iframe{
  height:38px !important;
  min-height:38px !important;
}

.tradingview-widget-container iframe{
  width:100% !important;
}

.ticker-bar{
  align-items:center !important;
}


.tradingview-widget-container__widget{
  height:38px !important;
}

.tradingview-widget-container iframe{
  opacity:1 !important;
  visibility:visible !important;
}


.ticker-shell{
background:transparent !important;
  flex:1;
  min-width:0;
  height:44px;
  display:flex;
  align-items:center;
}

.tv-clean-ticker{
  width:100%;
  height:44px !important;
  border-radius:10px;
  overflow:hidden;
  background:transparent !important;
  border:none !important;
}

.ticker-tv-wrap,
.ticker-tv-wrap iframe,
.tradingview-widget-container__widget{
  width:100% !important;
  height:44px !important;
  min-height:44px !important;
}

.tradingview-widget-container iframe{
  margin-top:-2px !important;
}


/* MOBILE RESPONSIVE FIXES */
@media(max-width:1024px){
  .topbar{
    padding:0 10px;
  }

  .tb-right{
    gap:6px;
  }

  .app{
    overflow:hidden;
  }

  .content{
    padding:12px;
  }

  .card,
  .trade-panel{
    padding:14px;
  }

  table{
    min-width:700px;
  }
}

@media(max-width:860px){

  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    height:100vh;
    z-index:9999;
    width:240px !important;
    transition:left .3s ease;
    box-shadow:0 0 30px rgba(0,0,0,.45);
  }

  .sidebar.collapsed{
    left:-100%;
    width:240px !important;
  }

  .sidebar.mobile-open{
    left:0;
  }

  .main{
    width:100%;
  }

  .topbar{
    gap:8px;
    height:auto;
    min-height:58px;
    padding:10px;
    flex-wrap:wrap;
  }

  .tb-left{
    width:100%;
  }

  .tb-right{
    width:100%;
    justify-content:flex-end;
  }

  .page-title{
    font-size:14px;
  }

  .ticker-shell{
    display:none;
  }

  .g4,
  .g3,
  .g2,
  .g12,
  .g23{
    grid-template-columns:1fr !important;
  }

  .settings-layout{
    grid-template-columns:1fr;
  }

  .section-hdr{
    align-items:flex-start;
  }

  .btn{
    width:100%;
    justify-content:center;
  }

  .filter-bar{
    flex-direction:column;
    align-items:stretch;
  }

  .search-wrap{
    width:100%;
    max-width:100% !important;
  }

  .trade-panel{
    overflow:hidden;
  }

  [style*="grid-template-columns:290px 1fr"]{
    grid-template-columns:1fr !important;
    height:auto !important;
  }

  [style*="height:calc(100vh - 118px)"]{
    height:auto !important;
  }

  [style*="min-height:500px"]{
    min-height:340px !important;
  }

  .copy-row{
    flex-direction:column;
    align-items:stretch;
  }

  .copy-row .btn{
    width:100%;
  }

  input,
  select,
  textarea{
    font-size:16px;
  }
}

@media(max-width:580px){

  .content{
    padding:10px;
  }

  .card,
  .card-sm,
  .trade-panel,
  .stat-card{
    padding:12px;
    border-radius:12px;
  }

  .topbar{
    padding:8px;
  }

  .tb-btn,
  .avatar{
    width:32px;
    height:32px;
  }

  .section-title{
    font-size:13px;
  }

  .stat-val{
    font-size:18px;
  }

  .tabs{
    overflow:auto;
    flex-wrap:nowrap;
    scrollbar-width:none;
  }

  .tabs::-webkit-scrollbar{
    display:none;
  }

  .tab{
    flex-shrink:0;
  }

  .table-wrap{
    overflow-x:auto;
  }

  .logo img{
    width:140px !important;
    height:auto !important;
  }
}

</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    
<div class="logo">
  <img src="assets/logo.png"
       alt="AtrontifyX Logo"
       style="width:180px;height:100px;object-fit:contain;border-radius:12px;flex-shrink:0">

  
</div>

    <nav class="nav" id="sideNav">
      <div class="nav-section">Main</div>
      <div class="nav-item active" data-page="dashboard" onclick="nav('dashboard')">
        <svg viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        <span class="nav-label">Dashboard</span>
      </div>
      <div class="nav-item" data-page="markets" onclick="nav('markets')">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span class="nav-label">Markets</span>
      </div>
      <div class="nav-item" data-page="terminal" onclick="nav('terminal')">
        <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span class="nav-label">Trade Terminal</span>
      </div>
      <div class="nav-section">Finance</div>
      <div class="nav-item" data-page="deposit" onclick="nav('deposit')">
        <svg viewBox="0 0 24 24"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
        <span class="nav-label">Deposit</span>
      </div>
      <div class="nav-item" data-page="withdraw" onclick="nav('withdraw')">
        <svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="m6 13 6-6 6 6"/><path d="M19 3H5"/></svg>
        <span class="nav-label">Withdraw</span>
      </div>
      <div class="nav-section">Account</div>
      <div class="nav-item" data-page="history" onclick="nav('history')">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span class="nav-label">History</span>
      </div>
      <div class="nav-item" data-page="settings" onclick="nav('settings')">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span class="nav-label">Settings</span>
      </div>

      <div class="nav-item" data-page="verification" onclick="openVerificationPage()">
        <svg viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <span class="nav-label">Verification</span>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <div class="nav-item" style="color:var(--red)">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="nav-label">Sign Out</span>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- TOPBAR -->
    <div class="topbar">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>











<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://guguugokdhiwobmuopro.supabase.co';

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1Z3V1Z29rZGhpd29ibXVvcHJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTgwNzIsImV4cCI6MjA5MzczNDA3Mn0.uaKxvC9PfevyNcgtRg8Hhzaljn9ae3pp3aqgFUMfSo8';

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

window.supabase = supabase;

window.userData = {
  fullName: 'New User',
  email: '',
  balance: 0
};

async function loadUserProfile() {

  try {

    const { data: authData, error: authError } =
      await supabase.auth.getUser();

    if (authError) {
      console.error(authError);
      return;
    }

    if (!authData || !authData.user) {
      console.warn('No authenticated user found');
      return;
    }

    const user = authData.user;

    const { data: profile, error: profileError } =
      await supabase
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .single();

    if (profileError) {
      console.error(profileError);
      return;
    }

    if (!profile) {
      console.warn('No profile found');
      return;
    }

    const firstName = profile.first_name || '';
    const lastName = profile.last_name || '';

    const fullName =
      `${firstName} ${lastName}`.trim() || 'New User';

    const initials =
      `${firstName.charAt(0)}${lastName.charAt(0)}`
        .toUpperCase() || 'NU';

    window.userData = {
      fullName,
      email: user.email || '',
      balance: profile.balance || 0
    };

    const avatar = document.getElementById('userAvatar');

    if (avatar) {
      avatar.textContent = initials;
    }

    const setMoney = (id, value) => {

      const el = document.getElementById(id);

      if (!el) return;

      el.textContent =
        '$' +
        Number(value || 0).toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
    };

    setMoney('portfolioBalance', profile.balance);
    setMoney('equityValue', profile.equity);
    setMoney('freeMargin', profile.free_margin);
    setMoney('totalPnl', profile.total_pnl);

    const winEl = document.getElementById('winningTrades');

    if (winEl) {
      winEl.textContent =
        `${Number(profile.winning_trades || 0)} winning trades`;
    }

    console.log('LIVE PROFILE LOADED:', profile);

  } catch (err) {

    console.error('Dashboard loading error:', err);

  }

}


async function loadDeposits() {

  try {

    const { data: authData } = await supabase.auth.getUser();

    if (!authData?.user) return;

    const { data, error } = await supabase
      .from('deposits')
      .select('*')
      .eq('user_id', authData.user.id)
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      return;
    }

    DEPOSITS = data || [];

    if (page === 'deposit') {
      render();
    }

  } catch (err) {
    console.error(err);
  }

}

async function loadWithdrawals() {

  try {

    const { data: authData } = await supabase.auth.getUser();

    if (!authData?.user) return;

    const { data, error } = await supabase
      .from('withdrawals')
      .select('*')
      .eq('user_id', authData.user.id)
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      return;
    }

    WITHDRAWALS = data || [];

    if (page === 'withdraw' || page === 'history') {
      render();
    }

  } catch (err) {
    console.error(err);
  }

}


async function submitBankWithdrawal() {

  const bankName =
    document.getElementById('bankName')?.value || '';

  const accountName =
    document.getElementById('accountName')?.value || '';

  const accountNumber =
    document.getElementById('accountNumber')?.value || '';

  console.log('CRYPTO WITHDRAW CLICKED');

  const amount =
    parseFloat(document.getElementById('bankWithdrawAmount')?.value || 0);

  if (!bankName || !accountName || !accountNumber) {
    alert('Complete all bank withdrawal fields');
    return;
  }

  if (!amount || amount <= 0) {
    alert('Enter valid withdrawal amount');
    return;
  }

  try {

    const { data: authData } = await supabase.auth.getUser();

    if (!authData?.user) {
      alert('Authentication required');
      return;
    }

    if (amount > Number(window.userData.balance || 0)) {
      alert('Insufficient balance');
      return;
    }

    const { error } = await supabase
      .from('withdrawals')
      .insert({
        user_id: authData.user.id,
        asset: 'BANK',
        amount: amount,
        wallet_address:
          bankName + ' | ' +
          accountName + ' | ' +
          accountNumber,
        status: 'pending'
      });

    if (error) {
      console.error(error);
      alert(error.message);
      return;
    }

    const newBalance =
      Number(window.userData.balance || 0) - amount;

    await supabase
      .from('profiles')
      .update({ balance: newBalance })
      .eq('id', authData.user.id);

    window.userData.balance = newBalance;

    await loadUserProfile();
    await loadWithdrawals();

    alert('Bank withdrawal request submitted successfully');

  } catch (err) {

    console.error(err);
    alert('Bank withdrawal failed');

  }

}




async function submitWithdrawal() {

  console.log('CRYPTO WITHDRAWAL STARTED');

  const allInputs = Array.from(document.querySelectorAll('input'));

  console.log('ALL INPUTS:', allInputs);

  let wallet = '';
  let amount = 0;

  allInputs.forEach((input) => {

    const placeholder =
      (input.placeholder || '').toLowerCase();

    const value =
      (input.value || '').trim();

    if (
      placeholder.includes('wallet') &&
      value.length > 0
    ) {
      wallet = value;
    }

    if (
      placeholder === '0.00' ||
      placeholder.includes('amount')
    ) {

      const parsed = parseFloat(value);

      if (!isNaN(parsed) && parsed > 0) {
        amount = parsed;
      }

    }

  });

  console.log('FINAL WALLET:', wallet);
  console.log('FINAL AMOUNT:', amount);

  if (!wallet) {
    alert('Enter wallet address');
    return;
  }

  if (!amount || amount <= 0) {
    alert('Enter valid withdrawal amount');
    return;
  }

  try {

    const {
      data: { user }
    } = await supabase.auth.getUser();

    if (!user) {
      alert('Login required');
      return;
    }

    const currentBalance =
      Number(window.userData?.balance || 0);

    console.log('CURRENT BALANCE:', currentBalance);

    if (amount > currentBalance) {
      alert('Insufficient balance');
      return;
    }

    const { error } = await supabase
      .from('withdrawals')
      .insert({
        user_id: user.id,
        amount: amount,
        asset: 'BTC',
        wallet_address: wallet,
        method: 'crypto',
        status: 'pending'
      });

    if (error) {
      console.error(error);
      alert(error.message);
      return;
    }

    const newBalance = currentBalance - amount;

    await supabase
      .from('profiles')
      .update({
        balance: newBalance
      })
      .eq('id', user.id);

    if (window.userData) {
      window.userData.balance = newBalance;
    }

    alert('Crypto withdrawal submitted successfully');

    location.reload();

  } catch (err) {

    console.error(err);
    alert('Withdrawal failed');

  }

}





window.submitBankWithdrawal = submitBankWithdrawal;
window.submitWithdrawal = submitWithdrawal;

window.addEventListener('load', async () => {
  await loadUserProfile();
  await loadDeposits();
  await loadWithdrawals();
});

</script>
