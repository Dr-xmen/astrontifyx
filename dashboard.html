
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtrontifyX</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0d0e12;
  color:white;
}
.container{
  padding:40px;
}
.logo{
  text-align:center;
  margin-bottom:40px;
}
.logo img{
  width:200px;
  height:200px;
  object-fit:contain;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:#161922;
  border:1px solid #2a2e3d;
  border-radius:16px;
  padding:30px;
  text-decoration:none;
  color:white;
  transition:.2s;
}
.card:hover{
  transform:translateY(-4px);
  border-color:#4f6ef7;
}
h2{
  margin:0 0 10px;
}
p{
  color:#9ea8c8;
  margin:0;
}
.page{
  padding:30px;
}
.back{
  display:inline-block;
  margin-bottom:20px;
  color:#4f6ef7;
  text-decoration:none;
}
</style>
</head>
<body>

<div class="container">

<div class="logo">
<img src="assets/logo.png" alt="logo">
</div>

<div class="grid">

<a class="card" href="trade-terminal.html">
<h2>Trade Terminal</h2>
<p>Open live trading terminal</p>
</a>

<a class="card" href="deposit.html">
<h2>Deposit</h2>
<p>Manage crypto deposits</p>
</a>

<a class="card" href="withdrawal.html">
<h2>Withdrawal</h2>
<p>Withdraw crypto or bank funds</p>
</a>

<a class="card" href="history.html">
<h2>History</h2>
<p>View account activity</p>
</a>

<a class="card" href="settings.html">
<h2>Settings</h2>
<p>Manage account preferences</p>
</a>

</div>
</div>
</body>
</html>
