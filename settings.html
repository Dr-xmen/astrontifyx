<!DOCTYPE html>

<link rel="icon" href="assets/favicon.png" type="image/png">

<link rel="stylesheet" href="shared.css">

<body>
<div class="app">

  <!-- SIDEBAR -->

    <div class="logo">
      <img src="assets/logo.png" alt="AtrontifyX" style="width:180px;height:100px;object-fit:contain;border-radius:12px;flex-shrink:0">
    </div>
    <nav class="nav">

        <svg viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        <span class="nav-label">Dashboard</span>
      </div>
      <div class="nav-item" data-page="markets" onclick="location.href='markets.html'">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span class="nav-label">Markets</span>
      </div>
      <div class="nav-item" data-page="terminal" onclick="location.href='trade-terminal.html'">
        <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span class="nav-label">Trade Terminal</span>
      </div>
      <div class="nav-section">Finance</div>
      <div class="nav-item" data-page="deposit" onclick="location.href='deposit.html'">
        <svg viewBox="0 0 24 24"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
        <span class="nav-label">Deposit</span>
      </div>
      <div class="nav-item" data-page="withdraw" onclick="location.href='withdrawal.html'">
        <svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="m6 13 6-6 6 6"/><path d="M19 3H5"/></svg>
        <span class="nav-label">Withdraw</span>
      </div>
      <div class="nav-section">Account</div>
      <div class="nav-item" data-page="history" onclick="location.href='history.html'">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span class="nav-label">History</span>
      </div>
      <div class="nav-item" data-page="notifications" onclick="location.href='notifications.html'">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="nav-label">Notifications</span>
      </div>
      <div class="nav-item" data-page="upgrade" onclick="location.href='account-upgrade.html'">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span class="nav-label">Account Upgrade</span>
      </div>
      <div class="nav-item" data-page="settings" onclick="location.href='settings.html'">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span class="nav-label">Settings</span>
      </div>
      <div class="nav-item" data-navaction="verification" onclick="location.href='settings.html#verification'">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="nav-label">Verification</span>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <button onclick="window.signOut && window.signOut()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 14px;border-radius:10px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.08);color:#ef4444;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s" onmouseover="this.style.background='rgba(239,68,68,.18)';this.style.borderColor='rgba(239,68,68,.5)'" onmouseout="this.style.background='rgba(239,68,68,.08)';this.style.borderColor='rgba(239,68,68,.3)'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Log Out</span>
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="tb-left">
        <div class="tb-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </div>
        <span class="page-title" id="pageTitle">Settings</span>
      </div>
      <div class="tb-right">
        <div class="tb-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        <div class="tb-btn notif-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot"></span>
        </div>
        <div class="tb-btn" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </div>
        <div class="avatar" id="userAvatar">--</div>
      </div>
    </div>

    <div class="content fade-in">
      <div class="settings-layout">

        <!-- Settings Nav -->
        <div class="card settings-nav">
          <div class="nav-item" id="snavProfile" onclick="setTab('profile')"><span class="nav-label">Profile</span></div>
          <div class="nav-item" id="snavSecurity" onclick="setTab('security')"><span class="nav-label">Security</span></div>
          <div class="nav-item" id="snavNotifications" onclick="setTab('notifications')"><span class="nav-label">Notifications</span></div>
          <div class="nav-item" id="snavPreferences" onclick="setTab('preferences')"><span class="nav-label">Preferences</span></div>
          <div class="nav-item" id="snavVerification" onclick="setTab('verification')"><span class="nav-label">Verification</span></div>
        </div>

        <!-- Settings Content -->
        <div class="card" id="settingsContent"></div>

      </div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
let settTab = 'profile';

const tabTitles = {profile:'Profile Settings',security:'Security',notifications:'Notifications',preferences:'Preferences',verification:'Verification'};

function setTab(t) {
  settTab = t;
  ['profile','security','notifications','preferences','verification'].forEach(name => {
    document.getElementById('snav'+name[0].toUpperCase()+name.slice(1)).classList.toggle('active', name===t);
  });
  document.getElementById('pageTitle').textContent = tabTitles[t] || 'Settings';
  renderTabContent();
}

function renderTabContent() {
  const el = document.getElementById('settingsContent');

  if (settTab === 'security') {
    el.innerHTML = `
      <div class="section-hdr"><span class="section-title">Security Settings</span></div>
      <div class="grid g2">
        <div class="fg"><label>Current Password</label><input type="password" placeholder="••••••••"></div>
        <div class="fg"><label>New Password</label><input type="password" placeholder="••••••••"></div>
        <div class="fg"><label>Two-Factor Authentication</label><select><option>Enabled</option><option>Disabled</option></select></div>
        <div class="fg"><label>Login Alerts</label><select><option>Enabled</option><option>Disabled</option></select></div>
      </div>
      <button class="btn btn-primary">Update Security</button>`;
    return;
  }

  if (settTab === 'notifications') {
    el.innerHTML = `
      <div class="section-hdr"><span class="section-title">Notification Settings</span></div>
      <div style="display:grid;gap:14px">
        <div class="card-sm"><div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-weight:600">Email Notifications</div><div style="font-size:12px;color:var(--text3)">Receive updates by email</div></div>
          <div class="toggle on"></div>
        </div></div>
        <div class="card-sm"><div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-weight:600">Trade Alerts</div><div style="font-size:12px;color:var(--text3)">Trading execution alerts</div></div>
          <div class="toggle on"></div>
        </div></div>
        <div class="card-sm"><div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-weight:600">Push Notifications</div><div style="font-size:12px;color:var(--text3)">Mobile/browser alerts</div></div>
          <div class="toggle"></div>
        </div></div>
      </div>`;
    return;
  }

  if (settTab === 'preferences') {
    const savedTheme = localStorage.getItem('atx_theme') || 'Dark';
    const savedLang  = localStorage.getItem('atx_language') || (window._userData && window._userData.language) || 'English';
    const langs = ['English','French','Spanish','Arabic','Portuguese','German','Italian','Chinese'];
    el.innerHTML = `
      <div class="section-hdr"><span class="section-title">Platform Preferences</span></div>
      <div class="grid g2">
        <div class="fg">
          <label>Theme</label>
          <select id="prefTheme">
            <option value="Dark" ${savedTheme==='Dark'?'selected':''}>Dark</option>
            <option value="Light" ${savedTheme==='Light'?'selected':''}>Light</option>
          </select>
        </div>
        <div class="fg">
          <label>Language</label>
          <select id="prefLang">${langs.map(l=>`<option value="${l}" ${savedLang===l?'selected':''}>${l}</option>`).join('')}</select>
        </div>
        <div class="fg">
          <label>Chart Type</label>
          <input value="Candlestick" readonly style="opacity:.6;cursor:not-allowed">
        </div>
        <div class="fg">
          <label>Default Pair</label>
          <input value="BTC/USD" readonly style="opacity:.6;cursor:not-allowed">
        </div>
      </div>
      <button class="btn btn-primary" onclick="window.savePreferences()">Save Preferences</button>
      <div id="prefSaveMsg" style="margin-top:10px;font-size:12.5px;color:var(--green);display:none">Preferences saved.</div>`;
    return;
  }

  if (settTab === 'verification') {
    const kyc = (window._userData?.kycStatus || 'pending').toLowerCase();
    const isVerified = kyc === 'verified';
    const isRejected = kyc === 'rejected';
    const isPending  = !isVerified && !isRejected;

    const headerBadge = isVerified
      ? `<span class="badge bg">Verified</span>`
      : isRejected
      ? `<span class="badge br">Rejected</span>`
      : `<span class="badge ba">Under Review</span>`;

    const statusBar = isVerified
      ? `<div class="progress-bar" style="margin-bottom:8px"><div class="progress-fill" style="width:100%;background:var(--green)"></div></div>
         <div style="font-size:12px;color:var(--green);font-weight:600">✓ Your identity has been verified. Full account access is unlocked.</div>`
      : isRejected
      ? `<div class="progress-bar" style="margin-bottom:8px"><div class="progress-fill" style="width:30%;background:var(--red)"></div></div>
         <div style="font-size:12px;color:var(--red)">Your documents were not accepted. Please re-submit via the verification page.</div>`
      : `<div class="progress-bar" style="margin-bottom:8px"><div class="progress-fill" style="width:70%;background:var(--amber)"></div></div>
         <div style="font-size:12px;color:var(--text3)">Your submitted documents are currently under review.</div>`;

    const docBadge = isVerified
      ? `<span class="badge bg">Verified</span>`
      : `<span class="badge ba">Submitted</span>`;

    const actions = isVerified
      ? ``
      : `<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
           <a href="verify.html" class="btn btn-primary" style="text-decoration:none">${isRejected ? 'Re-submit Documents' : 'View Verification'}</a>
         </div>`;

    el.innerHTML = `
      <div class="section-hdr">
        <span class="section-title">Identity Verification (KYC)</span>
        ${headerBadge}
      </div>
      <div class="grid g2">
        <div class="card-sm">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div><div style="font-weight:600">Government ID</div><div style="font-size:12px;color:var(--text3)">Passport or National ID</div></div>
            ${docBadge}
          </div>
          <div style="font-size:12px;color:var(--text3)">${isVerified ? 'Document verified and on file.' : 'Document submitted for review.'}</div>
        </div>
        <div class="card-sm">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div><div style="font-weight:600">Selfie Verification</div><div style="font-size:12px;color:var(--text3)">Identity photo</div></div>
            ${docBadge}
          </div>
          <div style="font-size:12px;color:var(--text3)">${isVerified ? 'Selfie verified and on file.' : 'Selfie submitted for review.'}</div>
        </div>
      </div>
      <div class="card-sm" style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div><div style="font-weight:600">Verification Status</div><div style="font-size:12px;color:var(--text3)">Compliance review progress</div></div>
          ${headerBadge}
        </div>
        ${statusBar}
      </div>
      ${actions}`;
    return;
  }

  // Default: profile (read-only — admin manages changes)
  const ud = window._userData || {};
  const avatarUrl  = ud.avatarUrl  || '';
  const initials   = ud.initials   || (ud.fullName ? ud.fullName[0].toUpperCase() : '?');
  const fullName   = ud.fullName   || '';
  const email      = ud.email      || '';
  const country    = ud.country    || '—';

  el.innerHTML = `
    <div class="section-hdr"><span class="section-title">Profile</span></div>

    <!-- Avatar upload -->
    <div style="display:flex;align-items:center;gap:20px;padding:4px 0 22px;border-bottom:1px solid var(--border);margin-bottom:20px">
      <div style="position:relative;cursor:pointer;flex-shrink:0" onclick="document.getElementById('avatarFileInput').click()" title="Click to change photo">
        <div id="avatarCircle" style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;overflow:hidden;border:3px solid var(--border)">
          ${avatarUrl ? `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.textContent='${initials}'">` : initials}
        </div>
        <div style="position:absolute;bottom:2px;right:2px;width:26px;height:26px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
      </div>
      <div>
        <div style="font-size:16px;font-weight:600;margin-bottom:3px">${fullName || 'Your Name'}</div>
        <div style="font-size:13px;color:var(--text3);margin-bottom:6px">${email}</div>
        <div style="font-size:11.5px;color:var(--text3)" id="avatarStatus">Click photo to upload</div>
      </div>
      <input type="file" id="avatarFileInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="window.uploadAvatar(this)">
    </div>

    <!-- Read-only profile fields -->
    <div class="grid g2">
      <div class="fg"><label>Full Name</label><input value="${fullName||'—'}" readonly style="opacity:.65;cursor:not-allowed"></div>
      <div class="fg"><label>Email Address</label><input value="${email||'—'}" readonly style="opacity:.65;cursor:not-allowed"></div>
      <div class="fg"><label>Country</label><input value="${country}" readonly style="opacity:.65;cursor:not-allowed"></div>
      <div class="fg"><label>Base Currency</label><input value="USD" readonly style="opacity:.65;cursor:not-allowed"></div>
    </div>
    <p style="margin-top:12px;font-size:11.5px;color:var(--text3)">Profile details are managed by an administrator. Contact support to request changes.</p>`;
}

// Read hash on load to open the correct tab
document.addEventListener('DOMContentLoaded', function() {
  const hash = window.location.hash.replace('#','');
  const validTabs = ['profile','security','notifications','preferences','verification'];
  const initial = validTabs.includes(hash) ? hash : 'profile';
  setTab(initial);
});
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script type="module">
const supabase = window.ATRONTIFY_DB;
const CACHE_KEY = 'atx_settings_profile';

async function signOut() { await supabase.auth.signOut(); location.href = 'login.html'; }
window.signOut = signOut;

// getSession() reads localStorage — no network call, fires immediately
const { data: { session } } = await supabase.auth.getSession();
if (!session) { location.href = 'login.html'; }
else {
  const user = session.user;
  const meta = user.user_metadata || {};
  const jwtFn = meta.first_name || '', jwtLn = meta.last_name || '';
  const jwtName = `${jwtFn} ${jwtLn}`.trim() || meta.full_name || user.email?.split('@')[0] || 'User';
  const jwtInitials = (jwtFn && jwtLn) ? `${jwtFn[0]}${jwtLn[0]}`.toUpperCase() : jwtName[0].toUpperCase();

  function buildUD(p) {
    const fn = p?.first_name || jwtFn, ln = p?.last_name || jwtLn;
    const fullName = `${fn} ${ln}`.trim() || jwtName;
    const initials = (fn && ln) ? `${fn[0]}${ln[0]}`.toUpperCase() : (fullName[0]||'?').toUpperCase();
    return { fullName, initials, email: user.email||'', avatarUrl: p?.avatar_url||'', country: p?.country||'—', language: p?.language || localStorage.getItem('atx_language') || 'English', kycStatus: p?.kyc_status || 'pending' };
  }

  const topAvatar = document.getElementById('userAvatar');

  function applyTopAvatar(ud) {
    if (!topAvatar) return;
    if (ud.avatarUrl) topAvatar.innerHTML = `<img src="${ud.avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    else topAvatar.textContent = ud.initials;
  }

  // Show avatar immediately from JWT
  if (topAvatar) topAvatar.textContent = jwtInitials;

  // Flash from cache (instant on repeat visits)
  try {
    const cached = sessionStorage.getItem(CACHE_KEY);
    if (cached) {
      window._userData = buildUD(JSON.parse(cached));
      applyTopAvatar(window._userData);
      window.renderTabContent?.();
    }
  } catch(e) {}

  // Fetch full profile
  const { data: profile } = await supabase.from('profiles')
    .select('first_name,last_name,country,avatar_url,language,kyc_status')
    .eq('id', user.id).single();

  if (profile) {
    window._userData = buildUD(profile);
    applyTopAvatar(window._userData);
    if (profile.language) localStorage.setItem('atx_language', profile.language);
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(profile)); } catch(e) {}
    window.renderTabContent?.();
  }

  // ── Avatar upload ─────────────────────────────────────────────────────
  window.uploadAvatar = async function(input) {
    const file = input.files[0];
    if (!file) return;
    const statusEl = document.getElementById('avatarStatus');
    const circleEl = document.getElementById('avatarCircle');
    if (statusEl) statusEl.textContent = 'Uploading…';

    // Instant local preview
    const reader = new FileReader();
    reader.onload = e => { if (circleEl) circleEl.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`; };
    reader.readAsDataURL(file);

    const ext = file.name.split('.').pop() || 'jpg';
    const path = `${user.id}/avatar.${ext}`;
    const { error: upErr } = await supabase.storage.from('avatars').upload(path, file, { upsert: true, contentType: file.type });
    if (upErr) { if (statusEl) statusEl.textContent = 'Upload failed — try again.'; return; }

    const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(path);
    const bust = publicUrl + '?t=' + Date.now();
    await supabase.from('profiles').update({ avatar_url: publicUrl }).eq('id', user.id);

    if (circleEl) circleEl.innerHTML = `<img src="${bust}" style="width:100%;height:100%;object-fit:cover">`;
    if (topAvatar) topAvatar.innerHTML = `<img src="${bust}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    if (statusEl) statusEl.textContent = 'Photo updated!';
    if (window._userData) window._userData.avatarUrl = publicUrl;
    try { const c = sessionStorage.getItem(CACHE_KEY); if (c) { const cp=JSON.parse(c); cp.avatar_url=publicUrl; sessionStorage.setItem(CACHE_KEY,JSON.stringify(cp)); } } catch(e) {}
    input.value = '';
  };

  // ── Save preferences ──────────────────────────────────────────────────
  window.savePreferences = async function() {
    const theme = document.getElementById('prefTheme')?.value || 'Dark';
    const lang  = document.getElementById('prefLang')?.value  || 'English';
    document.body.classList.toggle('light', theme === 'Light');
    localStorage.setItem('atx_theme', theme);
    localStorage.setItem('atx_language', lang);
    await supabase.from('profiles').update({ language: lang }).eq('id', user.id);
    if (window._userData) window._userData.language = lang;
    try { const c = sessionStorage.getItem(CACHE_KEY); if (c) { const cp=JSON.parse(c); cp.language=lang; sessionStorage.setItem(CACHE_KEY,JSON.stringify(cp)); } } catch(e) {}
    const msg = document.getElementById('prefSaveMsg');
    if (msg) { msg.style.display='block'; setTimeout(()=>msg.style.display='none',3000); }
  };
}
</script>
</body>
